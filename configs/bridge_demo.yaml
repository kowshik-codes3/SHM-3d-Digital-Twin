structure_id: bridge_demo
name: Suspension Bridge Prototype
structure_type: bridge
fs: 50.0
temperature_sensor_id: sensor_4

sensors:
  - id: sensor_0
    name: Sensor_Abutment_Left
    type: accel
    unit: g
    position_xyz: [-14.0, 0.5, 0.0]
    channel_index: 0
    description: Left abutment vertical response
  - id: sensor_1
    name: Sensor_Pier_Left
    type: accel
    unit: g
    position_xyz: [-7.0, 1.2, 0.0]
    channel_index: 1
    description: Left pier vertical and lateral response
  - id: sensor_2
    name: Sensor_MidSpan_Girder
    type: accel
    unit: g
    position_xyz: [0.0, 1.8, 0.0]
    channel_index: 2
    description: Mid-span girder flexural response
  - id: sensor_3
    name: Sensor_Pier_Right
    type: accel
    unit: g
    position_xyz: [7.0, 1.2, 0.0]
    channel_index: 3
    description: Right pier foundation response
  - id: sensor_4
    name: Sensor_Ambient_Temp
    type: temp
    unit: degC
    position_xyz: [0.0, 4.0, 0.0]
    channel_index: 4
    description: Diurnal ambient temperature

detectors:
  - detector_id: waveform_ae_fast
    type: waveform_ae
    update_cadence_seconds: 1.0
    params:
      input_size: 5
      target_size: 4
      seq_len: 50
      hidden: 32

persistence:
  persistence_k: 3
  t_persist: 0.04
  warning_debounce_seconds: 30.0

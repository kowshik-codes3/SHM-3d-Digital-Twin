name: StructureIQ CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests-and-benchmarks:
    name: Backend PyTest, Benchmark & E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Unit & Regression Tests
        run: |
          pytest backend/tests -v

      - name: Run Performance & Latency Benchmark
        run: |
          python scripts/run_benchmark.py

      - name: Run Full-Stack E2E Integration Suite
        run: |
          python scripts/run_e2e.py

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/shm-dashboard/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend/shm-dashboard
        run: npm ci

      - name: Run Linter
        working-directory: frontend/shm-dashboard
        run: npm run lint || true

      - name: Build Production WebGL Bundle
        working-directory: frontend/shm-dashboard
        run: npm run build

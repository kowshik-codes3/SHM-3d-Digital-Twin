<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 6: 3D Digital Twin WebGL Scene Verification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a202c;
            color: #e2e8f0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 380px;
            background: rgba(26, 32, 44, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #63b3ed;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        p.subtitle {
            font-size: 0.8rem;
            color: #a0aec0;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #e2e8f0;
            text-transform: uppercase;
            margin-top: 14px;
            margin-bottom: 8px;
            letter-spacing: 0.04em;
        }
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        button {
            background: #2d3748;
            color: #e2e8f0;
            border: 1px solid #4a5568;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #4a5568;
            border-color: #63b3ed;
            color: #ffffff;
        }
        button.btn-critical {
            border-color: #e53e3e;
            color: #feb2b2;
        }
        button.btn-critical:hover {
            background: #9b2c2c;
            color: #ffffff;
        }
        button.btn-warning {
            border-color: #dd6b20;
            color: #fbd38d;
        }
        button.btn-warning:hover {
            background: #9c4221;
            color: #ffffff;
        }
        button.btn-success {
            border-color: #38a169;
            color: #9ae6b4;
        }
        button.btn-success:hover {
            background: #276749;
            color: #ffffff;
        }
        #assertion-logs {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.72rem;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .log-entry {
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .log-pass { color: #48bb78; }
        .log-fail { color: #f56565; }
        .log-info { color: #63b3ed; }
        #status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 10px;
        }
        .badge-normal { background: rgba(56, 161, 105, 0.2); color: #48bb78; border: 1px solid #38a169; }
        .badge-critical { background: rgba(229, 62, 62, 0.2); color: #f56565; border: 1px solid #e53e3e; }
        .badge-warning { background: rgba(221, 107, 32, 0.2); color: #ed8936; border: 1px solid #dd6b20; }
    </style>

    <!-- Import Three.js & OrbitControls via ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <h1>SHM Digital Twin 3D Viewport</h1>
        <p class="subtitle">Phase 6: WebGL Mesh Tagging & Health Shaders</p>

        <div class="section-title">Node Simulation Controls</div>
        <div class="button-grid">
            <button class="btn-success" id="btn-all-normal">All Normal</button>
            <button class="btn-critical" id="btn-midspan-critical">MidSpan Critical</button>
            <button class="btn-warning" id="btn-pier-warning">Pier Left Warning</button>
            <button class="btn-critical" id="btn-abutment-critical">Abutment Right Critical</button>
            <button id="btn-temp-alert">Ambient Temp Alert</button>
            <button id="btn-random-sim">Random Telemetry</button>
        </div>

        <div class="section-title">Scene Health Status</div>
        <div>
            System State: <span id="status-badge" class="badge-normal">NORMAL</span>
        </div>

        <div class="section-title">Verification Assertions</div>
        <div id="assertion-logs">
            <div class="log-entry log-info">Initializing WebGL Scene Manager...</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { SceneManager } from './js/SceneManager.js';

        const logsContainer = document.getElementById('assertion-logs');
        const statusBadge = document.getElementById('status-badge');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-entry log-${type}`;
            div.textContent = msg;
            logsContainer.appendChild(div);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        const EXPECTED_CHANNELS = [
            "Sensor_Abutment_Left",
            "Sensor_Pier_Left",
            "Sensor_MidSpan_Girder",
            "Sensor_Pier_Right",
            "Sensor_Abutment_Right",
            "Sensor_Ambient_Temp"
        ];

        let sceneMgr = null;

        try {
            const container = document.getElementById('canvas-container');
            sceneMgr = new SceneManager(container, THREE, OrbitControls);
            log("✅ WebGL SceneManager initialized successfully.", "pass");

            // ── Run Automated Node Mapping Assertions ─────────────────────────
            let passCount = 0;
            EXPECTED_CHANNELS.forEach(channelId => {
                const nodeObj = sceneMgr.getNodeObject(channelId);
                if (nodeObj && nodeObj.isMesh) {
                    passCount++;
                    log(`[PASS] Found 3D Mesh for ML Channel: ${channelId}`, "pass");
                } else {
                    log(`[FAIL] Missing 3D Mesh for ML Channel: ${channelId}`, "fail");
                }
            });

            if (passCount === EXPECTED_CHANNELS.length) {
                log(`🎯 ASSERTION SUCCESS: 100% (${passCount}/${EXPECTED_CHANNELS.length}) ML channels resolved in 3D scene hierarchy.`, "pass");
            } else {
                log(`❌ ASSERTION FAIL: Only ${passCount}/${EXPECTED_CHANNELS.length} ML channels resolved.`, "fail");
            }

            // Test independent material instancing
            const mat1 = sceneMgr.getNodeObject("Sensor_Pier_Left").material;
            const mat2 = sceneMgr.getNodeObject("Sensor_Pier_Right").material;
            if (mat1 !== mat2) {
                log("✅ Independent material instancing verified (materials are distinct).", "pass");
            } else {
                log("❌ Material instancing failure: shared material detected.", "fail");
            }

        } catch (err) {
            log(`❌ Runtime Error: ${err.message}`, "fail");
            console.error(err);
        }

        // ── UI Button Event Listeners ──────────────────────────────────────────
        document.getElementById('btn-all-normal').addEventListener('click', () => {
            if (!sceneMgr) return;
            sceneMgr.resetAllNodes();
            statusBadge.className = 'badge-normal';
            statusBadge.textContent = 'NORMAL';
            log("Simulated: All nodes reset to NORMAL", "info");
        });

        document.getElementById('btn-midspan-critical').addEventListener('click', () => {
            if (!sceneMgr) return;
            sceneMgr.updateNodeHealth("Sensor_MidSpan_Girder", "CRITICAL", 4.156);
            statusBadge.className = 'badge-critical';
            statusBadge.textContent = 'CRITICAL (MidSpan Girder)';
            log("Simulated: Sensor_MidSpan_Girder → CRITICAL (MSE=4.156, 2Hz Pulse)", "fail");
        });

        document.getElementById('btn-pier-warning').addEventListener('click', () => {
            if (!sceneMgr) return;
            sceneMgr.updateNodeHealth("Sensor_Pier_Left", "WARNING", 0.145);
            statusBadge.className = 'badge-warning';
            statusBadge.textContent = 'WARNING (Pier Left)';
            log("Simulated: Sensor_Pier_Left → WARNING (MSE=0.145)", "info");
        });

        document.getElementById('btn-abutment-critical').addEventListener('click', () => {
            if (!sceneMgr) return;
            sceneMgr.updateNodeHealth("Sensor_Abutment_Right", "CRITICAL", 2.890);
            statusBadge.className = 'badge-critical';
            statusBadge.textContent = 'CRITICAL (Abutment Right)';
            log("Simulated: Sensor_Abutment_Right → CRITICAL (MSE=2.890)", "fail");
        });

        document.getElementById('btn-temp-alert').addEventListener('click', () => {
            if (!sceneMgr) return;
            sceneMgr.updateNodeHealth("Sensor_Ambient_Temp", "WARNING", 0.082);
            log("Simulated: Sensor_Ambient_Temp → WARNING", "info");
        });

        let simInterval = null;
        document.getElementById('btn-random-sim').addEventListener('click', (e) => {
            if (!sceneMgr) return;
            if (simInterval) {
                clearInterval(simInterval);
                simInterval = null;
                e.target.textContent = 'Random Telemetry';
                log("Stopped random telemetry simulation.", "info");
            } else {
                e.target.textContent = 'Stop Telemetry';
                log("Started continuous random telemetry stream simulation.", "pass");
                simInterval = setInterval(() => {
                    const randomChannel = EXPECTED_CHANNELS[Math.floor(Math.random() * EXPECTED_CHANNELS.length)];
                    const states = ["NORMAL", "NORMAL", "NORMAL", "WARNING", "CRITICAL"];
                    const randomState = states[Math.floor(Math.random() * states.length)];
                    sceneMgr.updateNodeHealth(randomChannel, randomState, Math.random() * 3.0);
                }, 1200);
            }
        });
    </script>
</body>
</html>
